plugins {
    id 'java'
    id 'maven-publish'
    id "com.gradleup.shadow" version "9.4.2"
}

group = 'net.lapismc'
version = '1.1.4'
description = "A spiritual successor to HeroChat, build from the ground up to be simple and extendable"
defaultTasks 'clean', 'build', 'shadowJar'

repositories {
    mavenCentral()
    //Paper Repo
    maven {
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
    //Personal Repo
    maven {
        name = "lapismc-repo"
        url = "https://maven.lapismc.net/releases/"
    }
    //Vault Repo
    maven {
        url = uri('https://nexus.hc.to/content/repositories/pub_releases/')
    }
    //PlaceholderAPI Repo
    maven {
        url = uri('https://repo.extendedclip.com/content/repositories/placeholderapi/')
    }
    //Discord SRV
    maven { url 'https://nexus.scarsz.me/content/groups/public/' }
    maven { url 'https://m2.dv8tion.net/releases' }
}

dependencies {
    implementation 'net.lapismc:LapisCore:1.13.11'
    implementation 'net.lapismc:LapisUI:1.4.2'
    compileOnly 'net.milkbowl.vault:VaultAPI:1.7'
    compileOnly 'me.clip:placeholderapi:2.11.5'
    compileOnly 'com.discordsrv:discordsrv:1.29.0'
    compileOnly 'net.dv8tion:JDA:5.2.3'
    compileOnly 'io.papermc.paper:paper-api:26.1.2.build.+'
}

processResources {
    filter {
        it.replace('${project.version}', project.getVersion())
    }
}

shadowJar {
    archiveFileName.set("LapisChat-" + project.getVersion() + ".jar")
    exclude 'javax/**'
    relocate("net.lapismc.lapiscore", "net.lapismc.lapischat.utils.core")
    relocate("net.lapismc.lapisui", "net.lapismc.lapischat.utils.ui")
}

javadoc {
    source = sourceSets.main.allJava
    include("net/lapismc/lapischat/api/*.java")
    include("net/lapismc/lapischat/framework/*.java")
    include("net/lapismc/lapischat/events/*.java")
}


tasks.register('javadocJar', Jar) {
    archiveClassifier.set('javadoc')
    from javadoc
}

tasks.register('sourcesJar', Jar) {
    archiveClassifier.set('sources')
    from sourceSets.main.allSource
}

artifacts {
    archives javadocJar, sourcesJar, shadowJar
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

java {
    withSourcesJar()
    withJavadocJar()
}

publishing {
    publications {
        shadow(MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            name 'Reposilite'
            url "https://reposilite.dnablue2112.com/releases/"
            credentials {
                username reposiliteUser
                password reposilitePassword
            }
        }
    }
}